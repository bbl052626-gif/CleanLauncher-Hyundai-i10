<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
            overflow: hidden;
        }

        /* Cabecera: Reloj y Estado */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #21262d;
            padding-bottom: 15px;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
        }

        #clock {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #58a6ff;
        }

        #date {
            font-size: 18px;
            color: #8b949e;
            text-transform: capitalize;
        }

        .status-icons {
            font-size: 20px;
            color: #8b949e;
            display: flex;
            gap: 20px;
        }

        /* Cuadrícula de Botones Principales (Optimizado para 9 pulgadas) */
        main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            flex-grow: 1;
            padding: 25px 0;
        }

        .card {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .card:active {
            transform: scale(0.95);
            background-color: #21262d;
            border-color: #58a6ff;
        }

        .card-icon {
            font-size: 48px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #c9d1d9;
        }

        /* Barra Inferior / Reproductor o Accesos Rápidos */
        footer {
            display: flex;
            justify-content: space-around;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 15px;
            padding: 15px;
        }

        .footer-btn {
            background: none;
            border: none;
            color: #c9d1d9;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 20px;
        }

        .footer-btn:active {
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <!-- Cabecera con Reloj en vivo -->
    <header>
        <div class="clock-container">
            <div id="clock">00:00</div>
            <div id="date">Cargando fecha...</div>
        </div>
        <div class="status-icons">
            <span>⚡ 12.4V</span>
            <span>📶 4G</span>
            <span>🎵 Launcher Pro</span>
        </div>
    </header>

    <!-- Botones principales gigantes -->
    <main>
        <div class="card" onclick="alert('Abriendo Mapas / Navegación')">
            <div class="card-icon">🗺️</div>
            <div class="card-title">Navegación</div>
        </div>
        <div class="card" onclick="alert('Abriendo Reproductor de Música')">
            <div class="card-icon">🎵</div>
            <div class="card-title">Música</div>
        </div>
        <div class="card" onclick="alert('Abriendo Radio FM')">
            <div class="card-icon">📻</div>
            <div class="card-title">Radio</div>
        </div>
        <div class="card" onclick="alert('Abriendo Bluetooth / Llamadas')">
            <div class="card-icon">📞</div>
            <div class="card-title">Bluetooth</div>
        </div>
        <div class="card" onclick="alert('Abriendo Cámara de Reversa')">
            <div class="card-icon">📷</div>
            <div class="card-title">Cámara</div>
        </div>
        <div class="card" onclick="alert('Abriendo Ajustes de Android')">
            <div class="card-icon">⚙️</div>
            <div class="card-title">Ajustes</div>
        </div>
    </main>

    <!-- Barra inferior -->
    <footer>
        <button class="footer-btn" onclick="location.reload()">🔄 Recargar</button>
        <button class="footer-btn" onclick="alert('Volumen -')">🔉 Vol -</button>
        <button class="footer-btn" onclick="alert('Volumen +')">🔊 Vol +</button>
        <button class="footer-btn" onclick="alert('Apagar Pantalla')">🌙 Apagar</button>
    </footer>

    <script>
        // Actualizar reloj y fecha en tiempo real
        function updateClock() {
            const now = new Date();
            
            // Hora formato 24h o 12h (aquí usamos 24h ideal para carros)
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;

            // Fecha bonita en español
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('es-ES', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
